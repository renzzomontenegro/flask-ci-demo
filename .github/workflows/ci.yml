name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t flask-ci-demo .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Clone if not exists
            if [ ! -d "flask-ci-demo" ]; then
              git clone https://github.com/renzzomontenegro/flask-ci-demo.git
            fi

            cd flask-ci-demo

            # Always reset to latest
            git fetch --all
            git reset --hard origin/main

            # Build Docker image
            docker build -t flask-ci-demo .

            # Stop old container
            docker stop app || true
            docker rm app || true

            # Run container
            docker run -d -p 80:5000 --name app flask-ci-demo